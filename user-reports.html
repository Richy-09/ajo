<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports — Ajo Savings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar" id="topbar">
    <button class="hamburger" id="hamburger" aria-label="Open menu"><i class="fas fa-bars"></i></button>
    <span class="topbar-logo"><i class="fas fa-piggy-bank"></i> Ajo Savings</span>
  </header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <nav class="sidebar" id="sidebar">
      <a href="index.html" class="sidebar-logo" style="text-decoration:none;" aria-label="Go to home page">
        <i class="fas fa-piggy-bank"></i> Ajo Savings
      </a>
      <ul class="nav-links">
        <li><a href="user-dashboard.html"     data-page="user-dashboard">    <i class="fas fa-home"></i>              My Dashboard</a></li>
        <li><a href="user-contributions.html" data-page="user-contributions"><i class="fas fa-hand-holding-usd"></i>  My Contributions</a></li>
        <li><a href="user-payments.html"      data-page="user-payments">     <i class="fas fa-money-bill-wave"></i>   My Payments</a></li>
        <li><a href="user-reports.html"       data-page="user-reports">      <i class="fas fa-chart-pie"></i>         My Reports</a></li>
        <li><a href="user-profile.html"       data-page="user-profile">      <i class="fas fa-user"></i>              My Profile</a></li>
      </ul>
      <div style="padding:16px 10px;border-top:1px solid rgba(255,255,255,0.08);margin-top:auto;">
        <button id="user-logout-btn" style="width:100%;padding:9px 12px;background:rgba(220,38,38,0.15);color:#fca5a5;border:none;border-radius:6px;font-size:0.875rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit;">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>My Reports</h1>
          <p>Your personal savings summary and history</p>
        </div>
      </div>

      <!-- Summary stat cards -->
      <div id="report-stats" class="stats-grid" style="margin-bottom:24px;"></div>

      <!-- Tab bar -->
      <div class="tab-bar" role="tablist">
        <button class="tab-btn active" data-tab="overview"      role="tab" aria-selected="true" >Overview</button>
        <button class="tab-btn"        data-tab="contributions" role="tab" aria-selected="false">Contributions</button>
        <button class="tab-btn"        data-tab="payments"      role="tab" aria-selected="false">Payments</button>
      </div>

      <!-- Overview Tab -->
      <div class="tab-panel" id="tab-overview" role="tabpanel">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

          <!-- Contribution breakdown -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">
                <i class="fas fa-hand-holding-usd" style="background:var(--success-faint);color:var(--success);"></i>
                Contribution Summary
              </span>
            </div>
            <div id="contrib-summary"></div>
          </div>

          <!-- Payment breakdown -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">
                <i class="fas fa-money-bill-wave" style="background:var(--warning-faint);color:var(--warning);"></i>
                Payment Summary
              </span>
            </div>
            <div id="payment-summary"></div>
          </div>

        </div>

        <!-- Monthly breakdown -->
        <div class="card" style="margin-top:20px;">
          <div class="card-header">
            <span class="card-title">
              <i class="fas fa-calendar-alt" style="background:var(--primary-faint);color:var(--primary);"></i>
              Monthly Contribution History
            </span>
          </div>
          <div id="monthly-breakdown"></div>
        </div>
      </div>

      <!-- Contributions Tab -->
      <div class="tab-panel" id="tab-contributions" role="tabpanel" style="display:none">
        <div class="card">
          <div class="card-header">
            <span class="card-title">
              <i class="fas fa-list" style="background:var(--success-faint);color:var(--success);"></i>
              All My Contributions
            </span>
            <span id="contrib-count" style="font-size:0.8rem;color:var(--text-muted);font-weight:500;"></span>
          </div>
          <div id="report-contrib-table"></div>
        </div>
      </div>

      <!-- Payments Tab -->
      <div class="tab-panel" id="tab-payments" role="tabpanel" style="display:none">
        <div class="card">
          <div class="card-header">
            <span class="card-title">
              <i class="fas fa-list" style="background:var(--warning-faint);color:var(--warning);"></i>
              All My Payments
            </span>
            <span id="payments-count" style="font-size:0.8rem;color:var(--text-muted);font-weight:500;"></span>
          </div>
          <div id="report-payments-table"></div>
        </div>
      </div>

    </main>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="js/user-reports.js"></script>
</body>
</html>
