<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Ajo Savings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar" id="topbar">
    <button class="hamburger" id="hamburger" aria-label="Open menu"><i class="fas fa-bars"></i></button>
    <span class="topbar-logo"><i class="fas fa-piggy-bank"></i> Ajo Savings</span>
  </header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <nav class="sidebar" id="sidebar">
      <a href="index.html" class="sidebar-logo" style="text-decoration:none;" aria-label="Go to home page"><i class="fas fa-piggy-bank"></i> Ajo Savings</a>
      <ul class="nav-links">
        <li><a href="user-dashboard.html"     data-page="user-dashboard">    <i class="fas fa-home"></i>              My Dashboard</a></li>
        <li><a href="user-contributions.html" data-page="user-contributions"><i class="fas fa-hand-holding-usd"></i>  My Contributions</a></li>
        <li><a href="user-payments.html"      data-page="user-payments">     <i class="fas fa-money-bill-wave"></i>   My Payments</a></li>
        <li><a href="user-reports.html"       data-page="user-reports">      <i class="fas fa-chart-pie"></i>         My Reports</a></li>
        <li><a href="user-profile.html"       data-page="user-profile">      <i class="fas fa-user"></i>              My Profile</a></li>
      </ul>
      <div style="padding:16px 10px;border-top:1px solid rgba(255,255,255,0.08);margin-top:auto;">
        <button id="user-logout-btn" style="width:100%;padding:9px 12px;background:rgba(220,38,38,0.15);color:#fca5a5;border:none;border-radius:6px;font-size:0.875rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit;">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>My Profile</h1>
          <p>View and update your personal details</p>
        </div>
      </div>

      <div class="content-grid">
        <!-- Display card -->
        <div class="card" id="user-profile-display">
          <div class="profile-avatar-wrap">
            <img id="avatar" src="" alt="Avatar" />
            <strong id="display-name" style="font-size:1rem;font-weight:700;color:var(--text);"></strong>
          </div>
          <div class="profile-info-row">
            <i class="fas fa-phone"></i>
            <span>Phone</span>
            <strong id="display-phone"></strong>
          </div>
          <div class="profile-info-row">
            <i class="fas fa-envelope"></i>
            <span>Email</span>
            <strong id="display-email"></strong>
          </div>
          <div class="profile-info-row">
            <i class="fas fa-calendar-alt"></i>
            <span>Joined</span>
            <strong id="display-joined"></strong>
          </div>
          <div class="profile-info-row">
            <i class="fas fa-circle" style="color:var(--success);font-size:0.5rem;"></i>
            <span>Status</span>
            <strong id="display-status"></strong>
          </div>
        </div>

        <!-- Edit form -->
        <div class="form-panel">
          <h2><i class="fas fa-pen" style="color:var(--primary);margin-right:6px;"></i>Edit Profile</h2>
          <form id="user-profile-form" novalidate>
            <div class="form-group">
              <label for="up-name">Full Name</label>
              <input type="text" id="up-name" class="form-control" placeholder="Your name" required />
              <span class="field-error" id="up-name-error"></span>
            </div>
            <div class="form-group">
              <label for="up-phone">Phone</label>
              <input type="tel" id="up-phone" class="form-control" placeholder="Phone number" />
            </div>
            <div class="form-group">
              <label for="up-email">Email</label>
              <input type="email" id="up-email" class="form-control" placeholder="Email address" required />
              <span class="field-error" id="up-email-error"></span>
            </div>
            <div class="form-group">
              <label for="up-password">New Password</label>
              <input type="password" id="up-password" class="form-control" placeholder="Leave blank to keep current" />
            </div>
            <button type="submit" class="btn btn-primary" id="up-submit" style="width:100%;justify-content:center;">
              <i class="fas fa-save"></i> Save Changes
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="js/user-profile.js"></script>
</body>
</html>
