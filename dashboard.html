<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Ajo Savings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Mobile top bar -->
  <header class="topbar" id="topbar">
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <i class="fas fa-bars"></i>
    </button>
    <span class="topbar-logo"><i class="fas fa-piggy-bank"></i> Ajo Savings</span>
  </header>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <a href="index.html" class="sidebar-logo" style="text-decoration:none;" aria-label="Go to home page">
        <i class="fas fa-piggy-bank"></i>
        Ajo Savings
      </a>
      <ul class="nav-links">
        <li><a href="dashboard.html" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="members.html" data-page="members"><i class="fas fa-users"></i> Members</a></li>
        <li><a href="contributions.html" data-page="contributions"><i class="fas fa-hand-holding-usd"></i> Contributions</a></li>
        <li><a href="payments.html" data-page="payments"><i class="fas fa-money-bill-wave"></i> Payments</a></li>
        <li><a href="reports.html" data-page="reports"><i class="fas fa-chart-bar"></i> Reports</a></li>
        <li><a href="profile.html" data-page="profile"><i class="fas fa-user"></i> Profile</a></li>
        <li><a href="settings.html" data-page="settings"><i class="fas fa-cog"></i> Settings</a></li>
      </ul>
      <div class="sidebar-footer">Ajo Savings Tracker v1.0</div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Dashboard</h1>
          <p>Welcome back — here's how the group is doing today.</p>
        </div>
      </div>

      <!-- Stat cards -->
      <div id="stats-grid" class="stats-grid"></div>

      <!-- Chart -->
      <div class="card chart-card" style="margin-top:20px;">
        <div class="card-header">
          <span class="card-title">
            <i class="fas fa-chart-line" style="background:var(--primary-faint);color:var(--primary);"></i>
            Savings Progress
          </span>
        </div>
        <div style="position:relative;height:260px;width:100%;">
          <canvas id="savings-chart"></canvas>
        </div>
      </div>

      <!-- Panels row -->
      <div class="dashboard-panels">
        <div class="card" id="recent-contributions">
          <div class="card-header">
            <span class="card-title">
              <i class="fas fa-hand-holding-usd" style="background:var(--success-faint);color:var(--success);"></i>
              Recent Contributions
            </span>
          </div>
        </div>
        <div class="card" id="latest-activities">
          <div class="card-header">
            <span class="card-title">
              <i class="fas fa-bolt" style="background:var(--warning-faint);color:var(--warning);"></i>
              Latest Activities
            </span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
