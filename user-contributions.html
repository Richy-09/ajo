<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Contributions — Ajo Savings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar" id="topbar">
    <button class="hamburger" id="hamburger" aria-label="Open menu"><i class="fas fa-bars"></i></button>
    <span class="topbar-logo"><i class="fas fa-piggy-bank"></i> Ajo Savings</span>
  </header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <nav class="sidebar" id="sidebar">
      <a href="index.html" class="sidebar-logo" style="text-decoration:none;" aria-label="Go to home page"><i class="fas fa-piggy-bank"></i> Ajo Savings</a>
      <ul class="nav-links">
        <li><a href="user-dashboard.html"     data-page="user-dashboard">    <i class="fas fa-home"></i>              My Dashboard</a></li>
        <li><a href="user-contributions.html" data-page="user-contributions"><i class="fas fa-hand-holding-usd"></i>  My Contributions</a></li>
        <li><a href="user-payments.html"      data-page="user-payments">     <i class="fas fa-money-bill-wave"></i>   My Payments</a></li>
        <li><a href="user-reports.html"       data-page="user-reports">      <i class="fas fa-chart-pie"></i>         My Reports</a></li>
        <li><a href="user-profile.html"       data-page="user-profile">      <i class="fas fa-user"></i>              My Profile</a></li>
      </ul>
      <div style="padding:16px 10px;border-top:1px solid rgba(255,255,255,0.08);margin-top:auto;">
        <button id="user-logout-btn" style="width:100%;padding:9px 12px;background:rgba(220,38,38,0.15);color:#fca5a5;border:none;border-radius:6px;font-size:0.875rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit;">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>My Contributions</h1>
          <p>Set your savings plan and track your progress</p>
        </div>
      </div>

      <!-- Savings Plan Card -->
      <div class="card" style="margin-bottom:24px;" id="savings-plan-card">
        <div class="card-header">
          <span class="card-title">
            <i class="fas fa-calendar-check" style="background:var(--primary-faint);color:var(--primary);"></i>
            My Savings Plan
          </span>
          <button id="edit-plan-btn" class="btn btn-secondary btn-sm">
            <i class="fas fa-pen"></i> Edit Plan
          </button>
        </div>

        <!-- Plan display (shown when plan exists) -->
        <div id="plan-display"></div>

        <!-- Plan setup form (shown when no plan or editing) -->
        <div id="plan-form-wrap" style="display:none;">
          <form id="plan-form" novalidate>

            <!-- Withdrawal Type — radio cards -->
            <div class="form-group">
              <label style="display:block;margin-bottom:10px;">Withdrawal Type</label>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

                <label id="type-fixed-label" style="cursor:pointer;">
                  <input type="radio" name="withdrawal-type" id="type-fixed" value="fixed" style="display:none;" />
                  <div class="withdrawal-option" id="type-fixed-card">
                    <div style="font-size:1.2rem;margin-bottom:6px;"><i class="fas fa-calendar-lock" style="color:var(--primary);"></i></div>
                    <div style="font-weight:700;font-size:0.875rem;margin-bottom:4px;">Fixed Withdrawal</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);line-height:1.4;">You can only withdraw when your savings plan period ends.</div>
                  </div>
                </label>

                <label id="type-flexible-label" style="cursor:pointer;">
                  <input type="radio" name="withdrawal-type" id="type-flexible" value="flexible" style="display:none;" />
                  <div class="withdrawal-option" id="type-flexible-card">
                    <div style="font-size:1.2rem;margin-bottom:6px;"><i class="fas fa-calendar-check" style="color:var(--success);"></i></div>
                    <div style="font-weight:700;font-size:0.875rem;margin-bottom:4px;">Flexible Withdrawal</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);line-height:1.4;">You can request a payment at any time during your savings period.</div>
                  </div>
                </label>

              </div>
              <span class="field-error" id="plan-type-error"></span>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
              <div class="form-group">
                <label for="plan-duration">Savings Duration</label>
                <select id="plan-duration" class="form-control" required>
                  <option value="">— Select duration —</option>
                  <option value="3">3 months</option>
                  <option value="6">6 months</option>
                  <option value="9">9 months</option>
                  <option value="12">12 months (1 year)</option>
                  <option value="18">18 months</option>
                  <option value="24">24 months (2 years)</option>
                  <option value="36">36 months (3 years)</option>
                </select>
                <span class="field-error" id="plan-duration-error"></span>
              </div>
              <div class="form-group">
                <label for="plan-start">Start Date</label>
                <input type="date" id="plan-start" class="form-control" required />
                <span class="field-error" id="plan-start-error"></span>
              </div>
            </div>
            <div style="display:flex;gap:10px;margin-top:4px;">
              <button type="submit" class="btn btn-primary" id="plan-submit">
                <i class="fas fa-save"></i> Save Plan
              </button>
              <button type="button" class="btn btn-secondary" id="plan-cancel" style="display:none;">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Make a Contribution -->
      <div class="card" style="margin-bottom:24px;">
        <div class="card-header">
          <span class="card-title">
            <i class="fas fa-plus-circle" style="background:var(--success-faint);color:var(--success);"></i>
            Make a Contribution
          </span>
        </div>
        <form id="contrib-form" novalidate>
          <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;">
            <div class="form-group" style="margin-bottom:0;">
              <label for="contrib-amount">Amount (₦)</label>
              <input type="number" id="contrib-amount" class="form-control" min="1" placeholder="e.g. 5000" required />
              <span class="field-error" id="contrib-amount-error"></span>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label for="contrib-date">Date</label>
              <input type="date" id="contrib-date" class="form-control" required />
              <span class="field-error" id="contrib-date-error"></span>
            </div>
            <div>
              <button type="submit" class="btn btn-primary" id="contrib-submit">
                <i class="fas fa-plus"></i> Add Contribution
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- Contribution History -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">
            <i class="fas fa-history" style="background:var(--success-faint);color:var(--success);"></i>
            Contribution History
          </span>
          <span id="contrib-total" style="font-size:0.8rem;color:var(--text-muted);font-weight:500;"></span>
        </div>
        <div class="table-toolbar">
          <input type="text" id="contrib-search" class="search-input" placeholder="Search by date or amount…" />
          <select id="contrib-sort" class="sort-select">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="amount-high">Highest Amount</option>
            <option value="amount-low">Lowest Amount</option>
          </select>
        </div>
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>Amount (₦)</th>
                <th>Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="my-contributions-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="js/user-contributions.js"></script>
</body>
</html>
